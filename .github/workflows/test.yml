name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 第一层：在 runner 里用 wrangler dev（workerd，与线上同引擎）跑冒烟测试，不需要 Cloudflare 账号
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: 打包检查
        run: npx wrangler deploy --dry-run --outdir dist
      - name: 启动 wrangler dev
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > dev.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8787/nope && break; sleep 1; done
      - name: 冒烟测试
        env:
          CONCURRENCY: '50'
        run: node test/smoke.mjs http://127.0.0.1:8787
      - name: wrangler 日志
        if: always()
        run: tail -n 100 dev.log || true

  # 第二层：部署到独立的测试 Worker（gmafx-test），再对线上地址跑一遍
  # 需要仓库 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID；没配置时自动跳过
  deploy-test:
    needs: local
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 检查 Secrets
        id: chk
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过部署"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.skip != '1'
        with:
          node-version: 22
      - if: steps.chk.outputs.skip != '1'
        run: npm install
      - name: 部署 gmafx-test
        id: deploy
        if: steps.chk.outputs.skip != '1'
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "部署地址：$URL"
      - name: 线上冒烟测试
        if: steps.chk.outputs.skip != '1'
        env:
          CONCURRENCY: '30'
        run: |
          sleep 10
          node test/smoke.mjs "${{ steps.deploy.outputs.url }}"
